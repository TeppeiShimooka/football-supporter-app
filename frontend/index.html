<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Football match managiment app for football football supporter">
    <link rel="stylesheet" href="sanitize.css">
    <link rel="stylesheet" href="style.css">
    <title>football-supporter</title>

</head>
<body>
    <aside class="slider" id="slider">
        <div class="slider-header">
            <button class="serch-btn" label="serch-btn"><img src="pictures/serch_icon2.jpg" class="serch-icon"></button>
            <input type="text" placeholder="Serch text" id="serch-team" label="serch-btn">
        </div>
        <nav class="slider-nav">
            <ul>
                <li><button  class="nav-items"><img src="pictures/favorite-icon.jpg" class="favorite-icon">Watchlist</button></li>
                <li><button class="nav-items">プレミアリーグ</button></li>
                <li><button class="nav-items">ラ・リーガ</button></li>
                <li><button class="nav-items">ブンデスリーガ</button></li>
                <li><button class="nav-items">セリエA</button></li>
                <li><button class="nav-items">リーグ・アン</button></li>
                <li><button class="nav-items">エールディビジ</button></li>
                <li><button class="nav-items">UEFAチャンピオンズリーグ</button></li>
            </ul>
        </nav>
    </aside>
    <header class="app-header" id="app-header">
        <div class="header-wrapper">
            <button id="menu-btn" class="menu-btn">
                <span class="menu-span"></span>
                <span class="menu-span"></span>
                <span class="menu-span"></span>
            </button>
            <a href="#app-header" class="header-title"><h1>Football Supporter</h1></a>
            <div class="season-wrapper">
                <select class="selected-season">
                    <option value="" class="season-value-now"></option>
                    <option value="" class="season-value-before"></option>
                    <option value="" class="season-value-before2"></option>
                </select>
                <div class="season">Season</div>
            </div>
        </div>
  
    </header>
    <main>
        <nav class="nav-league">
            <ul class="league-icon-container">
                 <li class="select-league">画面下、サイドバーからリーグを選択してください</li>
                <li><button class="nav-league-icon-btn" data-code="PL"><img src="https://crests.football-data.org/PL.png"  class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="PD"><img src="https://crests.football-data.org/laliga.png" class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="BL1"><img src="https://crests.football-data.org/BL1.png" class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="SA"><img src="https://crests.football-data.org/c111.png" class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="FL1"><img src="https://crests.football-data.org/FL1.png" class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="DED"><img src="https://crests.football-data.org/ED.png" class="nav-league-icon"></button></li>
                <li><button class="nav-league-icon-btn" data-code="CL"><img src="https://crests.football-data.org/CL.png" class="nav-league-icon"></button></li>
            </ul>
        </nav>





        <div class="title-wrapper">
            <img  src="" class="league-img"></img>
            <h2 class="league-name"></h2>  
        </div>
        <div class="MS-wrappper">
            <!-- <h3 class="Match-schedule">Match Schedule</h3> -->
             <div class="past-section"></div>
             <div class="now-maker"></div>
             <div class="upcoming-section"></div>
        </div> 

        <div>
            <div>
                <!-- <h3>Ranking</h3> -->
                <div></div>
            </div>
        </div>
    </main>

    <!-- <div class="match-details">
        Match Details
    </div> -->

    <script src="script.js"></script>
</body>
</html>
